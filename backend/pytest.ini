# -*- coding: utf-8 -*-
# S1-T9 统一 pytest 配置（R-平台-9 / P1-3）
#
# 用法（backend 目录下）：
#     python -m pytest            # 默认跑 tests/ 全部
#     python -m pytest tests/     # 显式目录
#     python -m pytest tests/test_queue.py -x  # 单文件
#
# 说明：
#   - testpaths=tests 仅收集 tests/ 下的 test_*.py（独立 tests_t*.py 验收脚本不混入 CI，
#     它们由 tests/ci_gate.py 显式编排调用，见 .github/workflows/ci_backend.yml）。
#   - norecursedirs 排除测试运行残留目录（tmp*、_diag、__pycache__、被 ACL 锁定的历史
#     遗留 tmpzwqrwe_v 等）——这些是历史沙箱产物，已在健康度治理中登记待提权归档。
#   - addopts 关闭 cacheprovider（CI/沙箱只读缓存目录会报 PytestCacheWarning，禁用后
#     无缓存依赖，输出干净）；-q 简洁输出。
#   - 各测试文件自带 sys.path.insert(backend)（与独立脚本运行一致），本配置不再依赖
#     pythonpath 插件，兼容 pytest>=6。
[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = tmp* _diag __pycache__ .* fw_* node_modules .venv
addopts = -p no:cacheprovider -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning