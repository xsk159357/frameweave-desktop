# .github/workflows/ci_backend.yml
# S1-T9 统一 pytest + CI 门禁（R-平台-9 / P1-3）。
#
# 触发：push、pull_request、schedule（每日回归）、workflow_dispatch。
# 依赖：FrameWeave/checkout + frameweave-plugins/checkout（插件仓库与此并列）。
name: Backend CI / S1-T9
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout frameweave-plugins (S1-T9)
        uses: actions/checkout@v4
        with:
          repository: FrameWeave/frameweave-plugins
          path: frameweave-plugins
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
      - name: Set FRAMEWEAVE_PLUGINS_DIR
        run: echo "FRAMEWEAVE_PLUGINS_DIR=$(pwd)/frameweave-plugins/packages" >> $GITHUB_ENV
      - name: Install backend deps
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt --quiet
          .venv/bin/python -m pip install pytest httpx websockets --quiet
      - name: Run pytest (R-平台-9)
        run: |
          cd backend
          .venv/bin/python -m pytest -q --junitxml=pytest_results.xml
      - name: Run CI gate
        run: |
          cd backend
          .venv/bin/python tests/ci_gate.py
      - name: Health governance (R-工程-1)
        run: |
          cd backend
          .venv/bin/python -m pytest -q tests/test_health_governance.py --tb=no
      - name: Archive evidence (R-工程-1)
        run: |
          cd backend
          echo "pytest exit: $?" >> $GITHUB_ENV
          echo "backend fw_* dirs (待提权): $(find . -maxdepth 1 -name 'fw_*' -type d | wc -l)" >> $GITHUB_ENV
          echo "cloud.db: $(ls -lh cloud.db 2>/dev/null | awk '{print $5}') (应为空=已移出)" >> $GITHUB_ENV
          echo "pyarmor.bug.log: $(ls -lh pyarmor.bug.log 2>/dev/null | awk '{print $5}') (应为空=已移出)" >> $GITHUB_ENV
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t9-ci-results
          path: |
            backend/pytest_results.xml
          retention-days: 30
          if-no-files-found: warn
  health:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frameweave-plugins
        uses: actions/checkout@v4
        with:
          repository: FrameWeave/frameweave-plugins
          path: frameweave-plugins
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
      - name: Set FRAMEWEAVE_PLUGINS_DIR
        run: echo "FRAMEWEAVE_PLUGINS_DIR=$(pwd)/frameweave-plugins/packages" >> $GITHUB_ENV
      - name: Run health governance
        run: |
          cd backend
          .venv/bin/python -m pytest -q tests/test_health_governance.py --tb=no
      - name: Upload health manifest
        uses: actions/upload-artifact@v4
        with:
          name: health-manifest
          path: classify.json
          retention-days: 30
